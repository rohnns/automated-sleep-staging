[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-staging-pipeline"
version = "0.1.0"
description = "Modular end-to-end clinical EEG sleep staging pipeline for Sleep-EDF Expanded."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sleep Staging Pipeline Contributors" }]
keywords = ["eeg", "sleep-staging", "mne", "pytorch", "clinical"]
# Pinned to the exact versions the reported results were produced with, so a
# fresh environment reproduces them. `torch` is pinned without a local CUDA
# suffix (the wheel actually used was 2.11.0+cu128); install the matching CUDA
# build from the PyTorch index if GPU training is wanted, otherwise the CPU
# wheel of the same version works and only changes speed, not results.
dependencies = [
    "mne==1.12.1",
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pyyaml==6.0.2",
    "scikit-learn==1.8.0",
    "scipy==1.15.3",
    "streamlit==1.56.0",
    "torch==2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sleep_staging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
